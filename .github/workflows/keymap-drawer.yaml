name: Draw keymap

on:
  push:
    # every branch, so keymap variants on their own branches (e.g. `sunaku`)
    # each get an accurate rendered diagram of what they actually build
    branches: ['**']
  workflow_dispatch:

jobs:
  draw:
    permissions:
      contents: write
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    with:
      keymap_patterns: 'config/*.keymap'
      # this repo builds firmware via Nix (see config/default.nix), not west,
      # so there is no config/west.yml for the reusable workflow to fetch
      west_config_path: ''
      output_folder: 'keymap-drawer'
      draw_args: "glove80:'-j config/info.json'"
